name: Notify IndexNow

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Notification only. Pages still publishes from main; quality checks stay local.
permissions:
  contents: read
  pages: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'AXcentDance/MilanoSensualCongress.github.io' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install page-discovery dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Notify search engines after verifying the live release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY: ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}
        run: python scripts/ping_indexnow.py --github-event $RECOVERY
